rules:
  - from: internal/cells/**
    allow:
      - internal/contracts/**
      - internal/platform/**
      - internal/cells/**/api # explicit cell contract packages only
    deny:
      - internal/app/**    # cells must not import wiring or app internals

  - from: cmd/**
    allow:
      - internal/app/**
    deny:
      - internal/cells/**  # cmd imports app only, not cells directly
