name: Bug report
description: Report a reproducible problem in the architecture template, scripts, or generated code.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for an agent or maintainer to reproduce it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Commands or steps that reproduce the problem.
      placeholder: |
        1. Run `task ...`
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior or error output
      render: shell
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: go version go1.27.0 linux/amd64

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant files, cells, logs, or architecture docs.
